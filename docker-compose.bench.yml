# ARTEX Tencent TSec Benchmark evaluation image — one-command local build + run.
# Independent from the production docker-compose.yml (multi-service: artex + postgres).
# Usage:
#   cp bench/.env.example bench/.env   # fill in LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in the foreground (view logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to also remove the data volume)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the network with the host: the container uses the host's network
    # stack directly, so it can reach target networks on the host/VPN.
    # In host mode there are no port mappings; the container binds directly to
    # the host ports: 8787 (UI/API), 8788 (proxy), and the internal PostgreSQL
    # 5432 — make sure these three ports are free on the host (stop any local
    # services occupying them before testing).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
